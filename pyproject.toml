[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "taidl-to"
version = "2.4"
description = "TAIDL-TO: Test Oracle Generator for Tensor Accelerator ISAs"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
    {name = "ACT Compiler Team"},
]
readme = "README.md"
dependencies = [
    "taidl @ git+https://github.com/act-compiler/taidl.git@v2.3",
    "numpy>=2.0",
    "jax==0.10.2",
    "jaxlib==0.10.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["taidl_to", "taidl_to.*"]

[tool.setuptools.package-data]
"taidl_to.templates" = ["*.txt"]
"taidl_to.generic" = ["*.py"]
"taidl_to" = ["xla-debug/*"]
